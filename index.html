<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TinyLink</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="container">
    <h1>TinyLink</h1>
    <form id="createForm">
      <input id="target" placeholder="https://example.com/long-url" required />
      <input id="code" placeholder="Optional code (6-8 alphanum)" />
      <button type="submit">Create</button>
    </form>
    <div id="msg"></div>
    <h2>Links</h2>
    <table id="linksTable">
      <thead><tr><th>Code</th><th>Target</th><th>Clicks</th><th>Last Clicked</th><th>Actions</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="/app.js"></script>
</body>
</html>
